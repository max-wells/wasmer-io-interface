[package]
name = "maxime15848/wasmer-io-interface"
version = "0.1.3"

[dependencies]
"wasmer/static-web-server" = "*"

[fs]
"/public" = "frontend/out"

[[command]]
name = "server"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-w", "/public"]
